name: Bug report
description: Something doesn't look or work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. A screenshot or short recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, starting from opening a Code conversation.
      placeholder: |
        1. Open the right sidebar
        2. ...
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The plugin version, the Claude desktop app version and the Claude Code version (Settings, or `claude --version`).
      placeholder: claudia-theme 1.0.0, desktop app 6.6395, Claude Code 2.1.326
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer
      description: Operating system, screen size, and the app's text size if you changed it.
      placeholder: Windows 11, 1920x1080, 125% scaling
